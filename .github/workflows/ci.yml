name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install
        run: npm ci --legacy-peer-deps

      - name: Quality gates
        run: bash scripts/check-quality.sh

      - name: Build
        env:
          GIT_SHA: ${{ github.sha }}
        run: npm run build

      - name: Bundle size budget
        run: node scripts/check-bundle-budget.mjs

      - name: Upload dist
        uses: actions/upload-artifact@v4
        with:
          name: dist-${{ github.sha }}
          path: dist
          retention-days: 7

  lighthouse:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install
        run: npm ci --legacy-peer-deps

      - name: Build (with build-info)
        env:
          GIT_SHA: ${{ github.sha }}
        run: npm run build

      - name: Run Lighthouse CI
        uses: treosh/lighthouse-ci-action@v11
        with:
          configPath: .lighthouserc.json
          uploadArtifacts: true
          temporaryPublicStorage: true

  axe:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install
        run: npm ci --legacy-peer-deps

      - name: Install Playwright + axe
        run: |
          npm install --no-save playwright @axe-core/playwright
          npx playwright install --with-deps chromium

      - name: Build
        env:
          GIT_SHA: ${{ github.sha }}
        run: npm run build

      - name: Smoke + axe
        run: node scripts/smoke.mjs
