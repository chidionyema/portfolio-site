name: Deploy

# Triggers:
#   - push to main: runs after CI passes (gated via workflow_run)
#   - manual dispatch from the Actions tab
#
# Required repo secrets (set once via deploy/cloudflare/up.sh):
#   CLOUDFLARE_API_TOKEN  — Pages:Edit + Account Settings:Read
#   CLOUDFLARE_ACCOUNT_ID — 32-hex from `wrangler whoami`
#   PUBLIC_API_URL        — deployed BFF URL (e.g. https://ritualworks-bffweb.fly.dev)
#
# Repo variables (optional override):
#   CLOUDFLARE_PAGES_PROJECT — defaults to "ritualworks"

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy:
    name: Cloudflare Pages
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLOUDFLARE_API_TOKEN:  ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install
        run: npm ci --legacy-peer-deps

      - name: Build with production API URL inlined
        env:
          GIT_SHA: ${{ github.sha }}
          PUBLIC_API_URL: ${{ secrets.PUBLIC_API_URL }}
        run: npm run build

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=${{ vars.CLOUDFLARE_PAGES_PROJECT || 'ritualworks' }} --branch=main
