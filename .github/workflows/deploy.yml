name: Deploy

# Triggers:
#   - workflow_run after CI passes on main
#   - manual dispatch from the Actions tab
#
# Required repo secrets (set via GitHub UI or deploy/cloudflare/up.sh if present):
#   CLOUDFLARE_API_TOKEN  — Pages:Edit + Account Settings:Read
#   CLOUDFLARE_ACCOUNT_ID — 32-hex from Cloudflare dashboard URL or `wrangler whoami`
#   PUBLIC_API_URL        — deployed BFF URL (e.g. https://ritualworks-bffweb.fly.dev)
#
# Repo variables (visible in build logs, tweakable without rotating secrets):
#   CLOUDFLARE_PAGES_PROJECT — defaults to "ritualworks"
#   PUBLIC_SIGNALR_URL       — e.g. https://ritualworks-bffweb.fly.dev/hubs/demo
#   PUBLIC_CLUSTER_LABEL     — defaults to "production"

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy:
    name: Cloudflare Pages
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      deployments: write
    env:
      CLOUDFLARE_API_TOKEN:  ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install
        run: npm install --legacy-peer-deps

      - name: Build with production env inlined
        env:
          GIT_SHA: ${{ github.sha }}
          PUBLIC_API_URL: ${{ secrets.PUBLIC_API_URL }}
          PUBLIC_SIGNALR_URL: ${{ vars.PUBLIC_SIGNALR_URL }}
          PUBLIC_CLUSTER_LABEL: ${{ vars.PUBLIC_CLUSTER_LABEL || 'production' }}
        run: npm run build

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=${{ vars.CLOUDFLARE_PAGES_PROJECT || 'haworks' }} --branch=main --commit-dirty=true
